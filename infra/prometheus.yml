# Глобальные настройки применяются ко всем скрейпам, если не переопределены.
global:
  # Как часто Prometheus дёргает /metrics. Меньше - свежее данные, но выше нагрузка.
  # 5s - агрессивно для локальной разработки, в проде обычно 15–30s.
  scrape_interval: 5s
  # Насколько долго ждать ответа от /metrics, прежде чем считать таргет down.
  scrape_timeout: 3s
  # Как часто пересчитываются recording/alerting rules (у нас их пока нет).
  evaluation_interval: 15s

scrape_configs:
  # Prometheus мониторит сам себя. Полезно, чтобы видеть лаг скрейпа и нагрузку.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Таргет для task01 / task03: твой Go-сервис, запущенный на хосте.
  # host.docker.internal - специальный DNS Docker Desktop, смотрящий на хост.
  # На Linux работает благодаря extra_hosts: host-gateway в docker-compose.yml.
  - job_name: go-service
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8081]
        labels:
          # Лейблы попадают во все метрики этого таргета.
          # Удобно фильтровать в PromQL: http_requests_total{env="local"}.
          env: local

  # Два сервиса из task04-project. Если ещё не запустил - Prometheus просто будет
  # показывать их как DOWN в /targets, это нормально.
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8082]
        labels:
          service: order
          env: local

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8083]
        labels:
          service: user
          env: local

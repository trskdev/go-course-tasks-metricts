services:
  # Prometheus - time-series DB и сборщик метрик.
  # Опрашивает /metrics у целевых сервисов по расписанию (см. infra/prometheus.yml).
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: obs-prometheus
    restart: unless-stopped
    # host.docker.internal - специальный DNS, чтобы из контейнера достучаться до сервиса,
    # запущенного на хосте (где ты делаешь `go run main.go`).
    # На Linux работает через extra_hosts ниже.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # web.enable-lifecycle позволяет перезагружать конфиг через POST /-/reload -
      # удобно, когда добавляешь новые scrape-таргеты без рестарта контейнера.
      - --web.enable-lifecycle

  # Grafana - визуализация. Datasources и пустая папка дашбордов провижнятся из infra/grafana.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: obs-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - jaeger
    ports:
      - "3000:3000"
    environment:
      # Дефолтные креды. В проде так не делай - используй secrets.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Отключаем онбординг-визард, чтобы сразу попадать в дашборды.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  # Jaeger all-in-one: collector + query + UI в одном контейнере.
  # Для прода разносят по ролям, но для локальной разработки all-in-one идеален.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: obs-jaeger
    restart: unless-stopped
    environment:
      # Включаем приём трейсов по OTLP (стандарт OpenTelemetry).
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

volumes:
  prom-data:
  grafana-data:
